# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric versions — verified against meta.fabricmc.net + the official example-mod (June 2026).
# MC 26.x is un-obfuscated: no mappings dependency, no mixin refmap.
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT
fabric_api_version=0.161.0+26.2
# Dev-server run dir, one per Minecraft line: a newer server silently and irreversibly upgrades an
# older line's dev world (run263 on main, run262 on 26.2, run on 26.1).
dev_run_dir=run262

# Mod metadata
mod_version=0.3.1
maven_group=com.k33bz.ropes
archives_base_name=ropes
